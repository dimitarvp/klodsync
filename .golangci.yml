# Lint contract for this repo (Dimi's ruling 2026-09-05): golangci-lint is the
# arbiter. vet, staticcheck and errcheck are unconditional; the opinionated
# linters below are enabled on purpose — every exclusion needs a written reason.
version: "2"

linters:
  default: none
  enable:
    - errcheck      # unhandled error returns
    - govet         # go vet
    - staticcheck   # bugs, simplifications, style (SA/S/ST/QF)
    - unused        # dead code
    - ineffassign   # assignments never read
    - errorlint     # errors compared/asserted without errors.Is/As, %w wrapping
    - gosec         # security: subprocess args, file perms, path traversal, …
    - gocritic      # diagnostics + style + performance opinions
    - unparam       # unused function parameters / constant results
    - misspell      # spelling in comments and strings
    - prealloc      # slices that could be preallocated
  settings:
    gocritic:
      enabled-tags: [diagnostic, style, performance]
    errcheck:
      check-blank: false
  exclusions:
    rules:
      # klodsync is an ssh/rsync/jq/cksum/perl driver: every subprocess argument is
      # built from its own config; nothing read from the hub is spliced into a command.
      - linters: [gosec]
        text: "G204"
      # G702 is the taint-analysis twin of G204: same subprocesses, same argument sources.
      - linters: [gosec]
        text: "G702"
      # A file-sync tool opens files by computed path by nature; the inputs are the
      # two ~/.claude trees, both ours.
      - linters: [gosec]
        text: "G304"
      # adopt: the taint analysis cannot see the bare-name validation at the top of
      # the function (no separator, no dot-name), after which the joined path cannot
      # leave projects/.
      - linters: [gosec]
        text: "G703"
        path: extras\.go
formatters:
  enable:
    - gofumpt
